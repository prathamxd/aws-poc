{% extends "base.html" %}
{% block title %}New ticket{% endblock %}
{% block content %}
<section class="card">
  <h1>Raise a support request</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/tickets/new" enctype="multipart/form-data">
    <label>Title <input name="title" maxlength="200" value="{{ form.title or '' }}" required></label>
    <label>Description <textarea name="description" rows="6" required>{{ form.description or '' }}</textarea></label>
    <label>Priority
      <select name="priority">
        {% for p in priorities %}<option {% if p == (form.priority or 'Medium') %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </label>
    <label>Attachment (optional, max {{ max_upload_mb }} MB)
      <input type="file" name="attachment">
      <small class="muted">Allowed: {{ allowed_extensions }}</small>
    </label>
    <button type="submit">Create ticket</button>
  </form>
</section>
{% endblock %}

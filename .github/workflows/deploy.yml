name: Deploy to AWS

# Builds the image, pushes it to Amazon ECR and restarts the app on EC2 via SSM.
# Authentication uses GitHub OIDC -> IAM role (no AWS access keys stored in GitHub).
# Needs these repository *variables* (Settings > Secrets and variables > Actions > Variables),
# all printed by `terraform output github_actions_variables`:
#   AWS_REGION, AWS_ROLE_ARN, ECR_REPOSITORY, EC2_INSTANCE_ID, APP_URL

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          VERSION=${GITHUB_SHA::7}
          IMAGE=$REGISTRY/$ECR_REPOSITORY
          docker build --build-arg APP_VERSION=$VERSION -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

      - name: Restart TicketDesk on EC2 (SSM Run Command)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TicketDesk deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["systemctl restart ticketdesk"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}'

      - name: Verify the new version is live
        if: ${{ vars.APP_URL != '' }}
        run: |
          VERSION=${GITHUB_SHA::7}
          for i in $(seq 1 36); do
            BODY=$(curl -fs "$APP_URL/health" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q "\"version\":\"$VERSION\""; then echo "Deployed $VERSION"; exit 0; fi
            sleep 5
          done
          echo "New version did not become healthy in time"
          exit 1
